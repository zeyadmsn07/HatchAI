[pytest]
testpaths = tests
norecursedirs = generated_mvps mvp_templates runs .git outputs .pytest_tmp
# Temp dirs (generated MVPs, test databases, outputs) go to <repo>/.pytest_tmp, not to the system
# drive. The path is set in tests/conftest.py (pytest_configure) relative to the repository root,
# so it is the same wherever pytest is started from; pytest wipes it at the start of every run.
