gate_1:
  evidence_score_go: 55
  evidence_score_stop: 25
  min_distinct_domains: 3
  max_research_rounds: 2
  max_pivots: 1
  require_target_market: true
  require_geography: true

gate_2:
  evidence_score_go: 55
  evidence_score_stop: 35
  viability_score_go: 3.0
  viability_score_stop: 2.0
  max_unresolved_kill_assumptions: 0

gate_3:
  min_tests: 6
  max_build_attempts: 2
  # Template selection: an idea must score at least this much for one template
  # (strong keyword = 2, weak = 1) and beat the runner-up by the margin; otherwise
  # no MVP is generated and Gate 3 recommends STOP.
  min_template_score: 2
  min_template_margin: 1

gate_4:
  require_pricing: true
  require_terms: true
  require_privacy: true
  require_refund_policy: true

gate_5:
  require_idempotency_pass: true
  require_revocation_pass: true
  require_reconciliation_pass: true

evidence_score:
  category_weight: 40
  verified_ratio_weight: 25
  domain_diversity_weight: 20
  source_type_weight: 15
  max_domains: 5

excluded_terms:
  - physical goods
  - financial advice
  - investment advice
  - crypto
  - cryptocurrency
  - bitcoin
  - health advice
  - medical advice
  - legal advice

forbidden_output_phrases:
  - guaranteed income
  - guaranteed profit
  - guaranteed results
  - you will earn
  - get rich
  - risk-free income
  - only a few spots left
  - offer ends in
  - limited time only

trick_intents:
  - create fake
  - fake reviews
  - fake testimonials
  - impersonate
  - pose as
  - fake sign-up
  - fake urgency
  - collect passwords
  - store card numbers
  - guaranteed income
  - guaranteed profit
  - guaranteed return
  - hold money
  - move money
  - countdown timer
